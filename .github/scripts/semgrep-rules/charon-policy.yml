# charon-policy.yml — the git-tracked Semgrep policy ruleset (the ADOPTED engine's rules).
#
# WHAT THIS IS: a MERGE-BOUNDARY BACKSTOP for portability/publication policy that any contributor
# or agent can violate. Semgrep is the maintained engine — this file is only the small,
# git-tracked ruleset it runs. NEVER hand-roll a linter here; add a rule, not a parser.
#
# WHAT THIS IS NOT: this is the POLICY/CONVENTION tier. It is NOT the secret-scanner (gitleaks),
# NOT the Python SAST (bandit), and NOT a provider-key-exfil security proof. It is ADDITIVE to
# those. Do not conflate, and do not treat a green here as a security proof.
#
# RELATIONSHIP TO tools/check_public_clean.py: that gate scans every TRACKED file line-by-line for
# the same publication tokens and is the authority for them. These two rules are a deliberate
# second, independent engine over the PR DIFF, in the language the code is written in — they add
# defense in depth, not a replacement. If the two ever disagree, check_public_clean wins.
#
# Keep the set SMALL and REAL: a rule that reds on legitimate product code gets disabled, which is
# worse than no rule. Every rule below is verified to hold on the tree as of 2026-08-04.
#
# DELIBERATELY NOT PORTED from the build repo's copy of this ruleset:
#   charon-no-hardcoded-anthropic-model (a string literal matching claude|anthropic|opus|sonnet|
#   haiku|fable). Measured on this repo 2026-08-04: 14 tracked product files legitimately carry
#   such literals, including src/charon/provider_presets/anthropic.py — the product is
#   provider-agnostic and SHIPS an Anthropic preset. A rule that reds on every PR touching
#   providers.py or model_catalog.py would be turned off within a week.
rules:
  # RULE 1 — flagship, load-bearing (the canary neuters THIS one).
  # No hardcoded private-LAN host/IP. Hosts must come from env/config: a source-baked private
  # address breaks fresh-install portability on any other machine AND leaks host topology into a
  # public repository. Matches private-LAN IPv4 literals ONLY (10.x / 192.168.x / 172.16-31.x);
  # loopback (localhost / 127.0.0.1) is deliberately NOT matched — it is legitimate in local test
  # servers and carries no topology leak.
  - id: charon-no-hardcoded-lan-host
    languages: [python]
    severity: ERROR
    message: >-
      Hardcoded private-LAN IP literal. Read hosts from env/config, not a source-baked address.
      An internal IP breaks fresh-install portability and leaks host topology into a public repo.
      Loopback is fine; a LAN address is not.
    patterns:
      - pattern-regex: '["''](?:https?://)?(?:10\.[0-9]|192\.168\.|172\.(?:1[6-9]|2[0-9]|3[01])\.)[0-9.]+(?::[0-9]{2,5})?[^"'']*["'']'

  # RULE 2 — no NEW Anthropic route on the gateway plane.
  # This replaces the rule deliberately not ported (see above) WITHOUT repeating its mistake. The
  # standing invariant is about ROUTING — the gateway must never send traffic to Anthropic — which
  # a lexical model-name match can never express, and which was left enforced by nothing at the
  # merge boundary once that rule was dropped. So match the two things that actually constitute a
  # route: the upstream host and the credential env var.
  # EXCLUDED by design: provider_presets/ (the product is provider-agnostic and legitimately SHIPS
  # an Anthropic preset for users who want one) and tests/ (which must be able to name what they
  # assert about). Measured 2026-08-04: 2 hits outside those directories, both docstring/
  # passthrough text, and both pre-existing — so this rule blocks nothing that exists today.
  - id: charon-no-anthropic-route
    languages: [python]
    severity: ERROR
    paths:
      exclude:
        - "**/provider_presets/**"
        - "**/tests/**"
    message: >-
      New Anthropic upstream route or credential on the gateway plane. The gateway must not route
      to Anthropic; select upstreams from tier/pool config. If this is a user-selectable provider
      preset, it belongs in provider_presets/, which this rule deliberately excludes.
    patterns:
      - pattern-regex: 'api\.anthropic\.com|ANTHROPIC_API_KEY'

  # RULE 3 — no developer-machine absolute path in source.
  # A hardcoded home-directory literal crosses a deploy boundary (it breaks on every other host,
  # in a container, and on a fresh install) AND leaks a personal path into a public repo. Use an
  # env-relative or repo-relative path.
  - id: charon-no-devbox-abspath
    languages: [python]
    severity: ERROR
    message: >-
      Developer-machine absolute path in source. Use an env-relative or repo-relative path.
      Such a literal breaks on any other host and leaks a personal path into a public repo.
    patterns:
      # public-clean: allow — a path-detection rule must spell the path prefix it detects.
      - pattern-regex: '["'']/home/[A-Za-z0-9_.-]+/[^"'']*["'']'

# -------------------------------------------------------------------------------------
# MONEY-PATH RULES (RULES 4-10) — the CG money-correctness invariants.
#
# WHAT THESE ARE: the merge-boundary backstop for CG's OWN money layer (billing, metering,
# spend/debit, balance, budget gates). They are re-grounded in the real money path
# (proxy.py, forwarder.py, balance.py, providers.py) and were measured on the 2026-08-07
# review: 0 false positives across 316 files / ~77.5k LOC, each rule proven live by a
# positive specimen, and the set already caught one real latent bug (prepaid under-drain).
#
# HOW TO READ ONE: every rule below is a "positive" invariant — it REDS on a shape that
# must never exist in the money path. A rule that fires on legitimate product code gets
# tightened or demoted to the advisory file; it is NEVER disabled (T5 blast radius). If
# a rule fires on the clean baseline, that is pattern-matching, not an invariant — the
# fixtures/ sibling files (semgrep-money-known-bad.py / semgrep-money-known-good.py) are
# the red-proof for that: each rule fires on the bad fixture and is silent on the good one.
#
# HOW TO ADD ONE: add a rule here, then add a specimen to fixtures/semgrep-money-known-bad.py
# that it catches and a corrected counterpart to fixtures/semgrep-money-known-good.py that it
# does NOT catch, and extend the canary (tests/semgrep-canary.test.sh) to assert both. A rule
# with no red-proof is not a rule.
#
# Every rule is `languages: [python]`, matching the money path's implementation language.
# -------------------------------------------------------------------------------------

  # RULE 4 — bill on a failed leg. A billing/metering write must never happen inside an
  # exception handler: that leg served no response, so charging it is billing a failure.
  # Missing usage is UNKNOWN cost, not a free or a billable leg.
  - id: cg-bill-on-failed-leg
    languages: [python]
    severity: ERROR
    message: >-
      Bill-exactly-once: a billing/metering write happens on a leg that did not
      serve a response (inside an exception handler).
    patterns:
      - pattern-either:
          - pattern: |
              try:
                  ...
              except $E:
                  ...
                  $M.record(..., count_usage=True, ...)
                  ...
          - pattern: |
              try:
                  ...
              except $E as $X:
                  ...
                  $M.record(..., count_usage=True, ...)
                  ...
          - patterns:
              - pattern-either:
                  - pattern: |
                      try:
                          ...
                      except $E:
                          ...
                          $L.record(...)
                          ...
                  - pattern: |
                      try:
                          ...
                      except $E as $X:
                          ...
                          $L.record(...)
                          ...
                  - pattern: |
                      try:
                          ...
                      except $E:
                          ...
                          $L.record_spend(...)
                          ...
                  - pattern: |
                      try:
                          ...
                      except $E as $X:
                          ...
                          $L.record_spend(...)
                          ...
                  - pattern: |
                      try:
                          ...
                      except $E:
                          ...
                          $L.charge(...)
                          ...
                  - pattern: |
                      try:
                          ...
                      except $E:
                          ...
                          $L.debit(...)
                          ...
              - metavariable-regex:
                  metavariable: $L
                  regex: (?i).*(ledger|billing|bill|spend|charge|debit|invoice|meter|cost|usage|budget|balance).*

  # RULE 5 — silent-zero metering. A cost variable set to a hard zero on the branch where
  # usage/token data is absent bills an unknown as free. Missing usage must raise or fall
  # back to a priced floor, never bill zero (R2: never record missing cost as $0).
  - id: cg-silent-zero-metering
    languages: [python]
    severity: ERROR
    message: >-
      Meter inertness: a cost variable is set to a hard zero on the branch where
      usage/token data is absent. Missing usage is UNKNOWN cost, not free cost -
      it must raise or fall back to a priced floor, never bill zero.
    patterns:
      - pattern-either:
          - pattern: |
              if $T is None:
                  $COST = 0.0
          - pattern: |
              if $T is None:
                  $COST = 0
          - pattern: |
              if not $T:
                  $COST = 0.0
          - pattern: |
              if not $T:
                  $COST = 0
          - pattern: |
              if $T is None:
                  $S.$COST = 0.0
          - pattern: |
              if $U.$F is None:
                  $COST = 0.0
      - metavariable-regex:
          metavariable: $COST
          regex: (?i).*(cost|price|usd|spend|charge|amount|bill|fee).*

  # RULE 6 — conditional-debit overdraft. A balance debit guarded by an affordability
  # check with NO else-branch serves an unaffordable request without debiting it (and the
  # read-modify-write is non-atomic). An unaffordable request must be refused, not served.
  - id: cg-conditional-debit-overdraft
    languages: [python]
    severity: ERROR
    message: >-
      Overdraft: the balance debit is guarded by an affordability check with no
      else-branch, so an unaffordable request is served but never debited (and
      the read-modify-write is non-atomic).
    pattern-either:
      - pattern: |
          if $REMAINING >= $COST:
              $BAL[$K] = $REMAINING - $COST
      - pattern: |
          if $REMAINING > $COST:
              $BAL[$K] = $REMAINING - $COST
      - pattern: |
          if $BAL[$K] >= $COST:
              $BAL[$K] = $BAL[$K] - $COST
      - pattern: |
          if $BAL[$K] >= $COST:
              $BAL[$K] -= $COST
      - pattern: |
          if $REMAINING >= $COST:
              $BAL.$F($K, $REMAINING - $COST)

  # RULE 7 — swallowed spend write. A spend/debit write wrapped in a bare swallow drops a
  # failed debit silently and serves the response unbilled. A failed debit must surface.
  - id: cg-swallowed-spend-write
    languages: [python]
    severity: ERROR
    message: >-
      A spend/debit write is wrapped in a bare swallow, so a failed debit is
      silently dropped and the response is served unbilled.
    patterns:
      - pattern-either:
          - pattern: |
              try:
                  ...
                  $L.record_spend(...)
                  ...
              except ...:
                  pass
          - pattern: |
              try:
                  ...
                  $L.record(...)
                  ...
              except ...:
                  pass
          - pattern: |
              try:
                  ...
                  $L.debit(...)
                  ...
              except ...:
                  pass
      - metavariable-regex:
          metavariable: $L
          regex: (?i).*(ledger|billing|bill|spend|charge|debit|meter|cost|balance|budget).*

  # RULE 8 — cost-zero-on-exception. A cost/pricing function returning zero from an
  # exception handler makes a pricing failure indistinguishable from a genuinely free
  # call. Pricing failure must raise (or fall back to a priced floor), not read as free.
  - id: cg-cost-zero-on-exception
    languages: [python]
    severity: ERROR
    message: >-
      A cost/pricing function returns zero from an exception handler, so a
      pricing failure is indistinguishable from a genuinely free call.
    patterns:
      - pattern-either:
          - pattern: |
              def $F(...) -> ...:
                  ...
                  try:
                      ...
                  except $E:
                      ...
                      return 0.0
          - pattern: |
              def $F(...) -> ...:
                  ...
                  try:
                      ...
                  except $E:
                      ...
                      return 0
          - pattern: |
              def $F(...):
                  ...
                  try:
                      ...
                  except $E:
                      ...
                      return 0.0
          - pattern: |
              def $F(...):
                  ...
                  try:
                      ...
                  except $E as $X:
                      ...
                      return 0.0
      - metavariable-regex:
          metavariable: $F
          regex: (?i).*(cost|price|pricing|spend|usd|bill|charge|debit|meter).*

  # RULE 9 — unlocked money accumulator. A non-atomic read-modify-write of a shared money
  # accumulator (dict/member/counter) outside any lock loses a charge when two served
  # responses race. Shared money state must fold under a lock (or an atomic op).
  - id: cg-unlocked-money-accumulator
    languages: [python]
    severity: WARNING
    message: >-
      Non-atomic read-modify-write of a shared money accumulator outside any
      lock - two concurrent served responses can lose a charge.
    patterns:
      - pattern-either:
          - pattern: |
              self.$D[$K] = self.$D.get($K, ...) + $V
          - pattern: |
              self.$D[$K] = self.$D[$K] + $V
          - pattern: |
              self.$D[$K] += $V
          - pattern: |
              self.$D = self.$D + $V
          - pattern: |
              self.$D += $V
      - metavariable-regex:
          metavariable: $D
          regex: (?i).*(spend|cost|usd|balance|billing|charge|budget).*
      - pattern-not-inside: |
          with $LOCK:
              ...
      - pattern-not-inside: |
          with $LOCK as $A:
              ...

  # RULE 10 — spend-gate result discarded. A spend/budget admission gate called as a bare
  # statement drops its allow/deny verdict and the request proceeds either way. The verdict
  # must be captured and acted on (assign it, branch on it, return it, or assert it).
  - id: cg-spend-gate-result-discarded
    languages: [python]
    severity: ERROR
    message: >-
      A spend/budget admission gate is called as a bare statement, so its
      allow/deny verdict is discarded and the request proceeds either way.
    patterns:
      - pattern-either:
          - pattern: $G.check(...)
          - pattern: $G.can_spend(...)
          - pattern: $G.authorize(...)
          - pattern: $G.reserve(...)
      - metavariable-regex:
          metavariable: $G
          regex: (?i).*(spend|budget|balance|limit|quota|cap|billing)[a-z_]*$
      - pattern-not-inside: |
          $X = ...
      - pattern-not-inside: |
          if ...:
              ...
          ...
      - pattern-not-inside: |
          return ...
      - pattern-not-inside: |
          assert ...
