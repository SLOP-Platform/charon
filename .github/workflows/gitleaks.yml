# gitleaks.yml — MERGE-BLOCKING secret-scan check using the ADOPTED gitleaks scanner.
#
# WHAT THIS IS: the server-side, un-bypassable check for LEAKED SECRETS. It runs the maintained
# gitleaks scanner + its default ruleset over the PR diff and BLOCKS MERGE on any leaked-secret
# finding that lands on a line the PR ADDED.
#
# WHAT THIS IS NOT: this is a secret-SCANNER (does a credential appear in the diff), NOT a
# provider-key-exfil proof and NOT the Python SAST (bandit). It is ADDITIVE to those and to
# tools/check_security.py.
#
# ---------------------------------------------------------------------------------------------
# RUNNER — HARD-PINNED to ubuntu-latest, deliberately. This repository is PUBLIC, and a
# self-hosted runner on a public repo lets a FORK'S pull request execute arbitrary code on that
# hardware. GitHub-hosted runners are free and unlimited for public repositories, so there is
# nothing to gain and a real risk to take on. Do NOT swap this literal for a runner-label
# variable lookup, and do NOT set a CI_RUNNER repository variable here.
#
# MAKING IT BLOCK: this workflow running green is NOT enforcement. Enforcement is being a REQUIRED
# status check in branch protection for `master`. Add the "gitleaks" context ONLY AFTER a real run
# has been observed completing on a real PR — a required context that has never reported blocks
# every PR forever.
# ---------------------------------------------------------------------------------------------
name: gitleaks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          # fetch-depth 0 is LOAD-BEARING: --diff scoping needs base..head history to resolve the
          # merge-base. A shallow checkout cannot, and the wrapper then FAILS CLOSED (exit 2)
          # rather than scan nothing and report green. Do not lower this.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Adopt the maintained scanner, PINNED TO AN EXACT VERSION. Why exact, not `latest`:
      #   A merge-blocking gate must be DETERMINISTIC. `latest` lets a fresh CI resolve to
      #   whatever release is newest at run time, and a gate whose verdict/rule-set depends on
      #   which gitleaks CI happened to fetch is a version-fragility we refuse. 8.21.2 is the
      #   version the canary (.github/scripts/tests/gitleaks-canary.test.sh) is validated against.
      #   To bump: change GITLEAKS_VERSION, re-run the canary locally on the new version, land
      #   them together.
      - name: Install gitleaks (the adopted scanner — pinned exact for a deterministic gate)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "$tmp/gitleaks.tar.gz" -C "$tmp" gitleaks
          sudo install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      # SELF-NEUTERING GUARD. `pull_request` workflows execute the code from the PR's merge ref,
      # so a PR that replaces this gate's own wrapper with `exit 0` would still report the
      # required context GREEN. Before running anything, restore .github/scripts/ from the merge
      # base, so the gate that judges a PR is the gate master already trusts. (The workflow YAML
      # itself still comes from the PR — GitHub reads it from the merge ref and that cannot be
      # changed here; .github/CODEOWNERS is the companion control, and it only bites once
      # "require review from Code Owners" is enabled in branch protection.)
      - name: Guard — run the gate's OWN code from the merge base, not from the PR
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD^1 2>/dev/null || true)"
          if [ -z "$base" ]; then echo "not a merge ref; nothing to restore"; exit 0; fi
          if ! git cat-file -e "$base:.github/scripts/bandit.sh" 2>/dev/null; then
            echo "gate scripts do not exist at the merge base — this PR introduces them; running the PR's copy"
            exit 0
          fi
          if git diff --quiet "$base" HEAD -- .github/scripts; then
            echo "gate scripts untouched by this PR"
          else
            echo "::warning title=Gate self-modification::this PR changes .github/scripts/; restoring that directory from $base for this run"
            git checkout "$base" -- .github/scripts
          fi

      # Prove the gate itself EXECUTES before trusting its verdict: the fail-on-revert canary must
      # pass. If the canary reds, the gate is untrustworthy and CI reds.
      - name: Canary — prove the gate fires and fails-on-revert
        run: bash .github/scripts/tests/gitleaks-canary.test.sh

      # DIFF-SCOPED on purpose, and LINE-exact: only findings on lines THIS PR added block merge.
      # A full-history scan would red on pre-existing synthetic keys the product's own security
      # tests are built around, and a gate that reds on untouched code gets disabled — the exact
      # failure this gate exists to prevent.
      - name: gitleaks secret scan (new findings only — exit 1 blocks merge)
        run: bash .github/scripts/gitleaks.sh --diff
