# gitleaks.yml — MERGE-BLOCKING secret-scan required check using the ADOPTED gitleaks scanner.
#
# WHAT THIS IS: the authority-tier, server-side, un-bypassable required check for LEAKED SECRETS
# (KS13). It runs the maintained gitleaks scanner + its default ruleset over the PR diff and BLOCKS
# MERGE on any leaked-secret finding. It covers ANY harness's output — Claude, the opencode leg, or a
# non-Claude gateway worker — because it fires server-side on the diff, not in the harness.
# (EVAL-REGISTRY: gitleaks = ADOPT.)
#
# WHAT THIS IS NOT: this is a secret-SCANNER (does a leaked credential appear in the diff), NOT the
# provider-key-exfil SECURITY invariant (that is enforced by the egress proxy / app-layer allowlist).
# It is ADDITIVE to, not a replacement for, the existing rig leak guards. Do not conflate.
#
# ---------------------------------------------------------------------------------------------------
# RUNNER — intended target is the `charon-ci` self-hosted pool; NOT hard-pinned. Why:
#   The rig learned (see rig-ci.yml RUNNER note) that pinning `runs-on: <self-hosted-label>` while
#   ZERO runners are registered makes the job QUEUE FOREVER — a check that never completes is a third
#   flavour of false green and pollutes every PR. So we use the repo's established variable pattern
#   with a hosted fallback, which lets the check RUN AND PRODUCE A REAL RED/GREEN NOW (gitleaks is a
#   single static binary on ubuntu-latest), and switches to charon-ci the moment that pool is online:
#     runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
#
# ENABLING THE REQUIRED CHECK (do this the moment the `charon-ci` runner pool is live):
#   1. Register the charon-ci self-hosted runner(s) on this repo.
#   2. Set repo variable CI_RUNNER to the charon-ci runner label (`gh variable set CI_RUNNER`).
#   3. In branch protection for `master`, add "gitleaks" to the REQUIRED status checks.
#   Until then this workflow still runs on ubuntu-latest and its result is advisory-but-real; branch
#   protection is what makes exit 1 actually BLOCK merge.
# ---------------------------------------------------------------------------------------------------
name: gitleaks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    # Hosted fallback by default; resolves to the charon-ci pool once CI_RUNNER is set (see header).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth 0 is LOAD-BEARING: --diff scoping needs base..head history to resolve the
          # merge-base. A shallow checkout cannot, and the wrapper then FAILS CLOSED (exit 2) rather
          # than scan nothing and report green. Do not lower this.
          fetch-depth: 0

      # Adopt the maintained scanner, PINNED TO AN EXACT VERSION. Why exact, not `latest`:
      #   A merge-blocking gate must be DETERMINISTIC. `latest` lets a fresh CI resolve to whatever
      #   release is newest at run time, and a gate whose verdict/rule-set depends on which gitleaks
      #   CI happened to fetch is a version-fragility we refuse (this is the exact failure the SEMGREP
      #   gate hit when CI floated the engine version). 8.21.2 is the version the canary
      #   (fleet/tests/gitleaks-canary.test.sh) is validated against.
      #   To bump: change GITLEAKS_VERSION, re-run the canary locally on the new version, land together.
      - name: Install gitleaks (the adopted scanner — pinned exact for a deterministic gate)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "$tmp/gitleaks.tar.gz" -C "$tmp" gitleaks
          sudo install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      # Prove the gate itself EXECUTES before trusting its verdict: the fail-on-revert canary must pass
      # (memory: gates-must-actually-run). If the canary reds, the gate is untrustworthy and CI reds.
      - name: Canary — prove the gate fires and fails-on-revert
        run: bash fleet/tests/gitleaks-canary.test.sh

      # DIFF-SCOPED on purpose: only NEW secrets introduced by THIS PR block merge. A full-history scan
      # would red on pre-existing findings, and a gate that reds on untouched history gets disabled —
      # the exact failure this gate exists to prevent (same doctrine as rig-ci.yml / semgrep.yml).
      - name: gitleaks secret scan (PR diff only — exit 1 blocks merge)
        env:
          RIG_CI_BASE: ${{ github.event.pull_request.base.sha || 'origin/master' }}
          RIG_CI_HEAD: ${{ github.sha }}
        run: bash fleet/checks/gitleaks.sh --diff
