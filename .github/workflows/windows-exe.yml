name: Windows EXE

# ADR-0005 D7 / P5 — builds charon.exe via PyInstaller on the free windows-latest
# runner. Deliberately pinned to a GitHub-hosted runner and never to a self-hosted
# one: this repository is PUBLIC, and a self-hosted runner would let a fork's pull
# request execute arbitrary code on the machine hosting it.
#
# Triggers: manual dispatch OR a version tag push (v*).
# NOT triggered on every push.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-exe:
    name: Build charon.exe
    runs-on: windows-latest  # free GitHub-hosted runner; never self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install package + PyInstaller
        run: pip install .[packaging]

      - name: Build charon.exe
        run: pyinstaller packaging/charon.spec

      - name: Smoke test — charon.exe --help exits 0
        # bash (Git Bash, preinstalled on windows-latest) uses `set -eo pipefail`,
        # so a non-zero exit fails the step; the exe's --help output prints inline.
        # Avoids the pwsh Start-Process exit-code footgun entirely.
        shell: bash
        run: dist/charon.exe --help

      - name: Upload charon.exe artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: charon-windows-exe
          path: dist/charon.exe
          if-no-files-found: error
          retention-days: 30
