name: release

# ADR-0002 §5 Tier 2b / SUPPLY-CHAIN.md §5: publish the Mode-B image to GHCR, but
# ONLY on a published Release and ONLY after the gate + image build pass — never
# an untested image (BR2-8). Back on GitHub, the original (cleanest) supply-chain
# path is restored: GHCR + GitHub-native SLSA provenance via OIDC
# (attest-build-provenance) — no key management, no cosign. The base is
# digest-PINNED (resolved fresh, recorded in provenance); only the immutable
# :vX.Y.Z is pushed, never :latest. No publish token surface exists off the
# release path. Runs on GitHub-hosted ubuntu-latest (free and unlimited on a public repo).
#
# SR-10: publish on TAG PUSH as well as on a published Release, so the GHCR image
# can never lag a pushed version tag (the deploy box pulls immutable :vX.Y.Z tags).
# Both triggers still gate on the same `gate` + `image-smoke` jobs (publish needs:
# them), so an untested image is never pushed. The derive-version step matches the
# tag to pyproject for both triggers via GITHUB_REF_NAME. Published tags are
# immutable — never overwritten, never :latest.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

# A tag push and its published Release both fire this workflow for the same ref
# (refs/tags/vX.Y.Z). On a shared persistent runner those two runs would
# otherwise execute at the same time and stomp each other (shared Docker state,
# duplicate publish push). Serialize per-ref so they run one after another;
# cancel-in-progress is false so the first run completes and publishes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    # HARD-PINNED ubuntu-latest — DO NOT reintroduce a self-hosted runner selection here.
    # This repository is PUBLIC. A self-hosted runner on a public repository lets a fork's
    # pull request execute arbitrary code on the machine hosting that runner, and our
    # runner hosts also run production services. Public repositories get GitHub-hosted CI
    # free and unlimited, so there is nothing to gain and a real compromise to lose.
    # Self-hosted runners are for the private repository only.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          # REQUIRED by the diff-coverage gate, which `charon gate` runs below.
          # It resolves the merge-base of origin/master and HEAD to work out
          # which lines this change adds; the default shallow checkout has no
          # origin/master at all, so the gate would fail closed on EVERY run.
          # fetch-depth: 0 makes actions/checkout fetch
          # +refs/heads/*:refs/remotes/origin/*, which is what puts origin/master
          # in the checkout. Reverting this line reds every release with
          # "base ref 'origin/master' does not resolve to a commit".
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: install (dev + service + router + quality)
        # [router] pulls litellm so the commodity-plane money-path tests
        # (streaming relay, park/cooldown, metering bridge) actually RUN in CI
        # instead of pytest.importorskip-skipping. litellm stays an OPTIONAL
        # extra (not a core runtime dep) until GW-CUTOVER; CI just installs it.
        # [quality] pulls coverage/pytest-cov/diff-cover for the diff-coverage
        # gate. Without it that gate fails closed on "required tooling not
        # installed" — it does NOT skip, by design.
        #
        # CONVERGED with ci.yml 2026-08-08 after TWO silent-wrong-version
        # releases. Before this, release.yml ran 4 of 23 checks as ad-hoc steps
        # with fewer extras; PRs passed ci.yml's full gate while the release
        # path missed the litellm money-path tests entirely.
        run: pip install -e '.[dev,service,router,quality]'

      - name: charon gate (lint, type, boundary, version, gate-registry, diff-coverage)
        # The diff-coverage gate is a CHECKS entry, so it runs HERE rather than as
        # a step of its own: it re-runs the suite under coverage (~35s measured),
        # and a separate step would pay that a second time. It costs ~0s on a
        # change that touches no src/**.py.
        run: python3 -m charon.cli gate

      - name: tests
        # Job-scoped tmp root (see ci.yml) — a shared persistent runner has no
        # per-job /tmp isolation, so a concurrent ci.yml gate run can otherwise
        # rm_rf this run's live pytest basetemp mid-suite.
        env:
          PYTEST_DEBUG_TEMPROOT: ${{ runner.temp }}
        run: pytest -q -n auto

  image-smoke:
    # HARD-PINNED ubuntu-latest — DO NOT reintroduce a self-hosted runner selection here.
    # This repository is PUBLIC. A self-hosted runner on a public repository lets a fork's
    # pull request execute arbitrary code on the machine hosting that runner, and our
    # runner hosts also run production services. Public repositories get GitHub-hosted CI
    # free and unlimited, so there is nothing to gain and a real compromise to lose.
    # Self-hosted runners are for the private repository only.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - name: build image
        run: docker build -t charon:ci .
      - name: run gateway + /v1/models
        # Image default is the token-gated gateway on :8080 (CMD in Dockerfile).
        # A tokenless 0.0.0.0 bind is refused (NonLoopbackBindWithoutToken), so we
        # supply CHARON_GATEWAY_TOKEN. The gateway returns HTTP 200 with an empty
        # model list before any provider is configured — that is sufficient for smoke.
        # Mode-B service surface (:8473/healthz) is exercised by the test suite in
        # the gate job and does not need a separate container here.
        run: |
          # Host port 0 = a free, kernel-assigned host port; never a fixed one.
          # The production gateway on the deployment host already
          # binds host 8080, and multiple release runs can land on that runner, so
          # any fixed host port (8080, 18080, ...) collides ("port is already
          # allocated", exit 125). The container name is run-scoped for the same
          # reason (a fixed name conflicts across concurrent runs). The container
          # still listens on its internal 8080 — only the host side is dynamic.
          name="charon-rel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker rm -f "$name" >/dev/null 2>&1 || true
          docker run -d --name "$name" \
            -e CHARON_GATEWAY_TOKEN=ci-smoke-token \
            -p 127.0.0.1:0:8080 charon:ci
          hostport=$(docker port "$name" 8080/tcp | head -n1 | sed 's/.*://')
          ok=0
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ci-smoke-token" \
              "http://127.0.0.1:${hostport}/v1/models") || true
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          docker logs "$name"
          docker rm -f "$name"
          test "${ok:-0}" = "1"

  publish:
    needs: [gate, image-smoke]
    # HARD-PINNED ubuntu-latest — DO NOT reintroduce a self-hosted runner selection here.
    # This repository is PUBLIC. A self-hosted runner on a public repository lets a fork's
    # pull request execute arbitrary code on the machine hosting that runner, and our
    # runner hosts also run production services. Public repositories get GitHub-hosted CI
    # free and unlimited, so there is nothing to gain and a real compromise to lose.
    # Self-hosted runners are for the private repository only.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write       # OIDC for build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: derive version (single source of truth = pyproject)
        id: ver
        run: |
          V=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # The release tag must match the package version (no drift).
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$V" ]; then
            echo "release tag '$GITHUB_REF_NAME' != pyproject version '$V'" >&2
            exit 1
          fi

      - name: resolve + pin base image digest (supply-chain gate)
        id: base
        run: |
          docker buildx imagetools inspect python:3.12-slim --raw > /dev/null
          DIGEST=$(docker buildx imagetools inspect python:3.12-slim \
                    --format '{{.Manifest.Digest}}')
          case "$DIGEST" in
            sha256:*) : ;;
            *) echo "could not resolve base digest" >&2; exit 1 ;;
          esac
          echo "base=python:3.12-slim@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pinned base: python:3.12-slim@${DIGEST}"

      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build + push (digest-pinned base, immutable version tag)
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.base }}
            CHARON_BUILD_SHA=${{ github.sha }}
          tags: ghcr.io/slop-platform/charon:v${{ steps.ver.outputs.version }}

      - name: attest build provenance (SLSA via GitHub OIDC)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/slop-platform/charon
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-assert:
    # RUNS REGARDLESS — gate, image-smoke, or publish may have failed.
    # Fails LOUD when publish was SKIPPED (the silent-wrong-version class:
    # the job never ran, so no image was pushed, and the deploy silently
    # pulls the OLD tag). Also asserts the image is actually pullable at
    # GHCR — "the workflow concluded" is not "the image exists".
    needs: [publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: derive version
        id: ver
        run: |
          V=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: assert publish completed (not skipped) and image pullable
        run: |
          result="${{ needs.publish.result }}"
          IMAGE="ghcr.io/slop-platform/charon:v${{ steps.ver.outputs.version }}"

          if [ "$result" = "skipped" ]; then
            echo "PUBLISH ASSERTION FAILED: publish job was SKIPPED." >&2
            echo "No image was pushed to GHCR. The deploy target would silently pull the OLD tag." >&2
            echo "This is the silent-wrong-version failure class." >&2
            exit 1
          fi

          if ! docker pull "$IMAGE" >/dev/null 2>&1; then
            echo "PUBLISH ASSERTION FAILED: image not pullable at $IMAGE" >&2
            if [ "$result" != "success" ]; then
              echo "Publish job concluded as '$result' AND the image is not present at GHCR." >&2
            else
              echo "Publish job reported success but the image is not present at GHCR —" >&2
              echo "possible registry propagation delay or concurrent-push overwrite." >&2
            fi
            exit 1
          fi

          echo "PUBLISH ASSERTION: OK — image confirmed pullable at $IMAGE"
