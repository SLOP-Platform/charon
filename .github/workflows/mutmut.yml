# mutmut.yml — DIFF-SCOPED MUTATION GATE.
# tools/mutmut_diff_gate.py landed on master via PR #237.
#
# WHAT THIS IS: a diff-scoped mutation gate. It breaks every changed function
# and checks whether any test notices. A test that passes on mutated code is
# not asserting on that behaviour — this IS the mechanical "asserting the right
# thing" test. It runs diff-scoped (only functions touched by the PR diff),
# which makes it gate-able: full-tree mutation is hours, diff-scoped is seconds.
#
# HONEST: surviving mutants turn this check RED. Clean diff → GREEN with an
# explicit message. Zero mutants → reports "mutated nothing" (not a silent pass).
# This gate is NOT a required check (not promoted to branch protection) but it
# CAN fail — unlike the report-only predecessor that always exited 0.
#
# RUNNER — HARD-PINNED to ubuntu-latest. This repository is PUBLIC.
# --------------------------------------------------------------------------
name: mutmut

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutmut-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: install (dev + quality)
        run: pip install -e '.[dev,quality]'

      - name: mutmut — diff-scoped mutation gate
        id: mutmut
        run: |
          set -euo pipefail
          python3 tools/mutmut_diff_gate.py 2>&1 | tee /tmp/mutmut.log