# mutmut.yml — REPORT-ONLY mutation testing workflow using the EXISTING
# tools/mutmut_diff_gate.py (landed on master via PR #237).
#
# WHAT THIS IS: a diff-scoped mutation gate. It breaks every changed function
# and checks whether any test notices. A test that passes on mutated code is
# not asserting on that behaviour — this IS the mechanical "asserting the right
# thing" test. It runs diff-scoped (only functions touched by the PR diff),
# which makes it gate-able: full-tree mutation is hours, diff-scoped is seconds.
#
# WHAT THIS IS NOT: this workflow is REPORT-ONLY. It does NOT block merge.
# Promotion to a required check is a deliberate later step, once it has been
# earning value in CI for a while and the sandbox suite RED blocker is resolved
# (see tools/gates.json mutmut entry cadence_note).
#
# RUNNER — HARD-PINNED to ubuntu-latest. This repository is PUBLIC.
# --------------------------------------------------------------------------
name: mutmut

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutmut-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: install (dev + quality)
        run: pip install -e '.[dev,quality]'

      - name: mutmut — mutation testing (report-only)
        id: mutmut
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/mutmut_diff_gate.py 2>&1 | tee /tmp/mutmut.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=mutmut gate::mutmut did not pass (exit $rc). This is REPORT-ONLY — it does NOT block merge. See workflow log for details."
          fi
          # Report-only: always exit 0 so this does not block merge.
          exit 0