# charon-policy.yml — the git-tracked Semgrep policy ruleset (the ADOPTED engine's rules).
#
# WHAT THIS IS: a MERGE-BOUNDARY BACKSTOP for on-plan / convention policy that any harness can
# violate (Claude, the opencode leg, or a non-Claude gateway worker). Semgrep is the maintained
# engine — this file is only the small, git-tracked ruleset it runs. NEVER hand-roll a linter here;
# add a rule, not a parser.
#
# WHAT THIS IS NOT: this is the POLICY/CONVENTION tier. It does NOT carry the provider-key-exfil
# SECURITY invariant — that is the egress proxy's job (fleet/checks + the app-layer allowlist).
# Do not add key-exfil rules here and do not treat a green here as a security proof.
#
# Every rule below is justified against a standing Charon directive (memory keys cited inline).
# Keep the set SMALL and REAL: a rule that cannot cite an on-plan directive does not belong here.
rules:
  # RULE 1 — flagship, load-bearing (the canary neuters THIS one).
  # Directive: sg-never-anthropic + gateway-client-agnostic — the SG/gateway plane must NEVER route
  # to an Anthropic/Claude model (Claude is the manager's model only) and must stay client-agnostic
  # with NO hardcoded provider model ids. This invariant "keeps sneaking back in", so it gets a
  # server-side backstop: a string literal that looks like an Anthropic model id in product/gateway
  # Python is flagged at the merge boundary regardless of which harness wrote it.
  - id: charon-no-hardcoded-anthropic-model
    languages: [python]
    severity: ERROR
    message: >-
      Hardcoded Anthropic/Claude model id in a string literal. The SG/gateway plane must never route
      to Anthropic and must stay client-agnostic (memory: sg-never-anthropic, gateway-client-agnostic).
      Route via tier/pool config, not a hardcoded provider model id.
    patterns:
      - pattern-regex: '["''](?:claude|anthropic|opus|sonnet|haiku|fable)[A-Za-z0-9._/\-]*["'']'

  # RULE 2 — no hardcoded private-LAN host/IP.
  # Directive: charon-gateway-host + public-repo-no-personal-info — the gateway lives at a
  # host-specific private address (10.0.1.60) that must come from env/config, and a PUBLIC repo must
  # carry no internal IPs/hosts. Matches private-LAN IPv4 literals ONLY (10.0.x / 192.168.x /
  # 172.16-31.x); loopback (localhost / 127.0.0.1) is deliberately NOT matched — it is legitimate in
  # local test servers and carries no topology leak.
  - id: charon-no-hardcoded-lan-host
    languages: [python]
    severity: ERROR
    message: >-
      Hardcoded private-LAN IP literal. Read hosts from env/config, not a source-baked address
      (memory: charon-gateway-host, public-repo-no-personal-info). An internal IP breaks fresh-install
      portability and leaks host topology into a public repo. Loopback is fine; a LAN address is not.
    patterns:
      - pattern-regex: '["''](?:https?://)?(?:10\.0\.[0-9]|192\.168\.|172\.(?:1[6-9]|2[0-9]|3[01])\.)[0-9.]+(?::[0-9]{2,5})?[^"'']*["'']'

  # RULE 3 — no dev-box absolute path in source.
  # Directive: no-hardcoded-cross-boundary-paths + public-repo-no-personal-info — a /home/stack/...
  # literal is the OPERATOR'S dev-box personal path: it crosses a deploy boundary (breaks on any other
  # host) AND leaks a personal path into a PUBLIC repo. Use an env-relative / repo-relative path.
  - id: charon-no-devbox-abspath
    languages: [python]
    severity: ERROR
    message: >-
      Dev-box absolute path in source. Use an env-relative or repo-relative path
      (memory: no-hardcoded-cross-boundary-paths, public-repo-no-personal-info). A /home/stack/...
      literal breaks on any other host and leaks a personal path into a public repo.
    patterns:
      - pattern-regex: '["'']/home/stack/[^"'']*["'']'
