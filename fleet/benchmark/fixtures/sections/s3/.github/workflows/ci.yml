name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install deps
        run: pip install -e .
      - name: Run tests
         run: pytest -q
      - name: Smoke test
        run: HOST_PORT=8080 bash scripts/smoke.sh
