[pytest]
# F21: the benchmark/ subtree holds golden + inert *fixture* trees (self-test
# corpora), not real unit tests. pytest was collecting them and throwing 59
# collection errors — a misleading red. norecursedirs skips them during
# recursion by basename, so it applies from ANY cwd (repo root OR fleet/),
# unlike a path-relative conftest collect_ignore_glob which only fires when
# pytest is launched from the dir holding it. Defaults preserved + `benchmark`.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} benchmark
