[tool.mypy]
python_version = "3.11"
files = ["src/charon", "tools", "tests"]
ignore_missing_imports = true
explicit_package_bases = true
# TOOL-ENABLE-RATCHET (2026-08-03): explicit_package_bases with neither
# mypy_path nor MYPYPATH set left module-name resolution for `mypy src tests`
# NONDETERMINISTIC run-to-run (e.g. src/charon/balance.py resolved as either
# "charon.balance" or "src.charon.balance" depending on the run, verified by
# repeated `--verbose` LOG inspection with a cleared cache each time) --
# which silently broke per-module [[tool.mypy.overrides]] matching. Pinning
# `src` as the explicit package root makes it deterministic.
mypy_path = ["src"]
# TOOL-ENABLE-RATCHET (2026-08-03): deliberately narrow strict slice. Skips
# disallow_untyped_defs (measured 1952 findings = churn, not signal).
check_untyped_defs = true
warn_unreachable = true
warn_return_any = true

# TOOL-ENABLE-RATCHET baseline (2026-08-03): mechanically generated from
# `mypy src tests` output the moment check_untyped_defs + warn_unreachable +
# warn_return_any were turned on -- run to a fixed point (suppressing one
# layer of untyped-def errors can surface downstream ones), always against a
# freshly cleared .mypy_cache. Each override is the exact accepted-floor
# error-code set for that module at enable time -- NOT a manual suppression.
# Any NEW error code on these modules, or ANY error on a module not listed
# here, fails the gate. Module names verified via `mypy --verbose` LOG output
# (stable only once `mypy_path = ["src"]` above pinned package-base
# resolution): src/charon/x.py -> "charon.x"; a package's __init__.py -> the
# package name itself; tests/x.py -> "tests.x"; tools/x.py -> "tools.x".
