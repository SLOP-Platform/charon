[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
# Repo root on sys.path so `tools.*` imports resolve under the bare `pytest`
# console script in CI (not just `python -m pytest`, which adds CWD itself).
# `src` is listed so tests import THIS checkout's package, not a `charon`
# editable-installed elsewhere — without it, pytest run inside a git worktree
# resolves `import charon` back to the main clone's src (false red/green).
pythonpath = [".", "src"]
# TOOL-ENABLE-RATCHET (2026-08-03): pytest-timeout was installed but never
# wired up (no addopts anywhere). Measured slowest test in the full suite at
# 7.03s (test_ksf_vendor_gates.py::test_check_redproof_wrapper); 60s gives
# ~8x headroom over that so a genuine hang gets killed well inside CI's
# 20-minute job timeout instead of stalling it. Signal-based (default) timeout
# method won't interrupt a blocked subprocess.run() on some platforms (Python
# retries syscalls on EINTR) -- it's a backstop against runaway Python code,
# not a hard guarantee against every hang shape.
addopts = ["--timeout=60"]
