[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "charon"
version = "0.6.1"
description = "A thin orchestrator that ferries one unit of work across swappable coding-agent backends, keeping a vendor-neutral Work Ledger as the single source of truth."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nnyan", email = "Nnyan@users.noreply.github.com" }]
keywords = ["agents", "orchestration", "acp", "llm", "autonomous"]

# The core currently declares no runtime dependencies — this is a CURRENT FACT,
# not a mandate. Per the operator ADOPT-FIRST directive (2026-07-21) a maintained
# runtime dependency is ALLOWED and no ADR is required to add one; adopting a
# suitable existing library is the default, preferred path and hand-rolling is the
# last-resort choice. The HTTP service remains an OPTIONAL extra so its stack only
# lands when the service surface is installed.
dependencies = []

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]
# ADR-0017 adopt: litellm.Router as a LIBRARY for the gateway commodity plane
# (failover / cooldown / allowed_fails / cost / mechanical ordering). Kept an OPTIONAL
# extra while it is OPT-IN and not yet the live money-path; promote to core `dependencies`
# when the live wire-in lands (accepting the ~218MB + native deps ADR-0017 calls out).
# httpx ships with litellm and backs `no_redirect_client()`.
router = ["litellm>=1.93"]
dev = ["pytest>=8", "pytest-xdist>=3.8", "ruff>=0.4", "mypy>=1.9", "pip-audit>=2.7", "httpx>=0.27"]
# BUILD-time only — never installed into the privileged gateway path (ADR-0005 D5)
packaging = ["pyinstaller>=6.0"]

[project.scripts]
charon = "charon.cli:main"

[project.urls]
Homepage = "https://github.com/SLOP-Platform/charon"
Repository = "https://github.com/SLOP-Platform/charon"

[tool.hatch.build.targets.wheel]
packages = ["src/charon"]

# TOOL-ENABLE-RATCHET (2026-08-03): bandit was rig-only (0 in product CI) even
# though its own baseline mechanism (`-b/--baseline`, built into bandit itself
# -- no separate package needed) is exactly the ratchet this needs. Scoped to
# `src` (the shipped product code); tests/tools stay out of scope the same way
# ruff's S101 (assert-in-tests) does for the equivalent ruff rule family.
# `.bandit-baseline.json` (repo root, generated by
# `bandit -r src -f json -o .bandit-baseline.json`) is the accepted floor: 56
# findings (3 HIGH, 1 MEDIUM, 52 LOW) measured 2026-08-03. Run
# `make security` to check for anything NEW beyond that floor.
[tool.bandit]
exclude_dirs = ["tests", "tools/_vendor"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
preview = true
# Vendored third-party code (KSF inert-code gate) — not linted to our standards.
extend-exclude = ["tools/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# extend-select adds bandit-equivalent security checks (S), blind-except (BLE),
# unused-arguments (ARG), and mccabe complexity (C90) on top of the base set.
extend-select = ["S", "BLE", "ARG", "C90"]

[tool.ruff.lint.per-file-ignores]
# TOOL-ENABLE-RATCHET baseline (2026-08-03): mechanically generated from
# `ruff check .` output the moment preview + extend-select(S,BLE,ARG,C90) were
# turned on. Each entry is the exact accepted-floor rule set for that file at
# enable time -- NOT a manual suppression. Any NEW rule violation on these
# files, or ANY violation on a file not listed here, fails the gate.
